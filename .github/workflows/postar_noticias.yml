
name: Bot Diario de Noticias

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:
  inputs:
    test_tema:
      description: |
        Escolha a editoria para testar:
        1 - Segurança e Polícia
        2 - Economia e Finanças
        3 - Política e Governo
        4 - Saúde e Sociedade
        5 - Tecnologia e Ciência
        6 - Oportunidades e Serviços
      required: true
      type: choice
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
      default: "1"

      test_publicar:
        description: "Publicar a postagem de teste? 0 = NÃO | 1 = SIM"
        required: true
        type: choice
        options:
          - "0"
          - "1"
        default: "0"

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Criar token.json a partir do Secret
        run: echo "${{ secrets.BLOGGER_TOKEN_BASE64 }}" | base64 --decode > token.json

      - name: Rodar Bot de Noticias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          TEST_TEMA: ${{ github.event.inputs.test_tema || '1' }}
          TEST_PUBLICAR: ${{ github.event.inputs.test_publicar || '0' }}
        run: python run_bot.py

      - name: Commitar arquivos de controle automaticamente
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add posts_publicados.txt 2>/dev/null || true
          git add controle_diario.txt 2>/dev/null || true
          git add controle_imagens.txt 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nenhuma alteração para commit."
          else
            git commit -m "Atualiza arquivos de controle automaticamente"
            git pull --rebase origin main
            git push origin main
          fi
